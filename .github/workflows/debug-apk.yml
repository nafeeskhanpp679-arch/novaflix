name: Build Debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Keep the debug signing certificate stable between builds so Firebase
      # Google Sign-In SHA-1 does not change on every fresh GitHub runner.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: novaflix-debug-signing-key-v1

      - name: Create debug keystore if cache is empty
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=NovaFlix Debug,O=NovaFlix,C=IN"
          fi
          echo "NovaFlix debug signing SHA-1 (register this in Firebase):"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cinestream-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
